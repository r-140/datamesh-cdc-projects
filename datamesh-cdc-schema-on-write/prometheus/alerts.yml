groups:
  - name: cdc_pipeline
    interval: 30s
    rules:
      - alert: PostgresDWHDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres DWH is down"
          description: "Postgres exporter on {{ $labels.instance }} has been down for more than 1 minute."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count{datname="datamesh_dwh"} > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Postgres DWH high connection count"
          description: "DWH has {{ $value }} active connections (> 20)."

      - alert: PostgresDeadTuplesHigh
        expr: pg_stat_user_tables_n_dead_tup > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres dead tuples high"
          description: "Table {{ $labels.relname }} has {{ $value }} dead tuples. Run VACUUM."

      - alert: KafkaConnectDown
        expr: up{job="kafka-connect"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka Connect is down"
          description: "Kafka Connect on {{ $labels.instance }} is unreachable."
