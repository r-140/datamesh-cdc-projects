name: Data Mesh CDC Platform CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'debezium/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'debezium/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== LINT & FORMAT ==========
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff black mypy

      - name: Run Ruff (linting)
        run: ruff check src/ tests/

      - name: Run Black (formatting)
        run: black --check src/ tests/

      - name: Run MyPy (type checking)
        run: mypy src/ --ignore-missing-imports

  # ========== UNIT TESTS ==========
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=src/datamesh_cdc --cov-report=xml --cov-report=term -m "not integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ========== SCHEMA COMPATIBILITY CHECKS ==========
  schema-compat:
    name: Schema Compatibility Checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate Avro schemas
        run: |
          python -c "
          import json
          import fastavro.schema
          from pathlib import Path

          schemas = list(Path('debezium').rglob('*.avsc'))
          if not schemas:
              print('No .avsc files found, skipping')
              exit(0)

          for schema_file in schemas:
              with open(schema_file) as f:
                  schema = json.load(f)
              fastavro.schema.parse_schema(schema)
              print(f'✅ Valid schema: {schema_file}')
          "

      - name: Check schema compatibility rules
        run: |
          python -m src.datamesh_cdc.schema_evolution_service --simulate

  # ========== INTEGRATION TESTS ==========
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, schema-compat]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start infrastructure
        run: |
          docker compose up -d postgres-orders postgres-customers zookeeper kafka schema-registry minio iceberg-rest
          sleep 30

      - name: Wait for services
        run: |
          ./scripts/wait-for-services.sh

      - name: Run integration tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v -m integration --timeout=300

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs > docker-logs.txt
          docker compose ps

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ========== BUILD & PUSH DOCKER IMAGE ==========
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, schema-compat]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== SECURITY SCAN ==========
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ========== DEPLOY (SIMULATED) ==========
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging (simulated)
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo "This would trigger:"
          echo "  - Helm upgrade / kubectl apply"
          echo "  - Database migration"
          echo "  - Smoke tests"
          echo "  - Canary rollout"
