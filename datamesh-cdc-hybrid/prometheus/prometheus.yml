global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: hybrid-consumer
    static_configs:
      - targets: ["hybrid-consumer:8000"]
  - job_name: kafka-connect-jmx
    static_configs:
      - targets: ["kafka-connect:7071"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
