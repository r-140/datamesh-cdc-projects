services:
  # ==================== SOURCE DATABASES ====================
  postgres-orders:
    image: debezium/postgres:15-alpine
    container_name: postgres-orders
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
      - ./scripts/init_orders.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - datamesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-customers:
    image: debezium/postgres:15-alpine
    container_name: postgres-customers
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customers_db
    volumes:
      - postgres_customers_data:/var/lib/postgresql/data
      - ./scripts/init_customers.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - datamesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customers_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== DWH (TARGET FOR DBT) ====================
  postgres-dwh:
    image: postgres:15-alpine
    container_name: postgres-dwh
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: datamesh_dwh
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./postgres-dwh/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - datamesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh -d datamesh_dwh"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== KAFKA (KRaft) ====================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTYwNTUENDI2Qg
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - datamesh

  # ==================== SCHEMA REGISTRY ====================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - datamesh

  # ==================== KAFKA CONNECT (CDC) ====================
  kafka-connect:
    build:
      context: ./kafka-connect
      dockerfile: Dockerfile
    container_name: kafka-connect
    ports:
      - "8083:8083"
      - "7071:7071"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_OPTS: "-javaagent:/usr/share/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/usr/share/jmx_exporter/config.yml"
    volumes:
      - ./prometheus/jmx_exporter_config.yml:/usr/share/jmx_exporter/config.yml:ro
      - connect_plugins:/usr/share/confluent-hub-components
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres-orders:
        condition: service_healthy
      postgres-customers:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - datamesh

  # ==================== CONNECTOR SETUP (one-shot) ====================
  setup-connectors:
    image: curlimages/curl:latest
    container_name: setup-connectors
    volumes:
      - ./scripts/setup-connectors.sh:/setup-connectors.sh:ro
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      MAX_RETRIES: "60"
      SLEEP_SEC: "2"
    entrypoint: ["/bin/sh", "/setup-connectors.sh"]
    depends_on:
      kafka-connect:
        condition: service_healthy
    networks:
      - datamesh
    restart: "no"

  # ==================== MONITORING ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - datamesh

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://dwh:dwh@postgres-dwh:5432/datamesh_dwh?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres-dwh:
        condition: service_healthy
    networks:
      - datamesh

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3000:3000"
    entrypoint: >
      sh -c "
        mkdir -p /var/lib/grafana/dashboards &&
        chown -R grafana:grafana /var/lib/grafana/dashboards &&
        chmod 644 /var/lib/grafana/dashboards/*.json 2>/dev/null || true &&
        /run.sh
      "
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - datamesh


networks:
  datamesh:
    driver: bridge

volumes:
  postgres_orders_data:
  postgres_customers_data:
  postgres_dwh_data:
  kafka_data:
  grafana_data:
  connect_plugins:
