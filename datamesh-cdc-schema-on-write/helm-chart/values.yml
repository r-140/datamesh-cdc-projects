# Helm values for datamesh-cdc deployment

replicaCount: 2

image:
  repository: yourusername/datamesh-schema-evolution
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_BOOTSTRAP: "kafka:9092"
  ICEBERG_REST_URL: "http://iceberg-rest:8181"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
