name: CI — Schema-on-Read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -e ".[dev]"
      - name: Lint Python
        run: ruff check src/ scripts/ tests/
      - name: Lint dbt
        run: |
          cd dbt_datamesh
          dbt deps
          dbt parse --warn-error

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dwh
          POSTGRES_PASSWORD: dwh
          POSTGRES_DB: datamesh_dwh
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest psycopg2-binary
          pip install -e ".[dev]"
      - name: Seed test data
        run: |
          psql postgresql://dwh:dwh@localhost:5434/datamesh_dwh -f scripts/init-dwh.sql
      - name: Run unit tests
        run: pytest tests/ -v

  dbt-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dwh
          POSTGRES_PASSWORD: dwh
          POSTGRES_DB: datamesh_dwh
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install dbt-postgres
          cd dbt_datamesh && dbt deps
      - name: Seed DWH schema
        run: |
          psql postgresql://dwh:dwh@localhost:5434/datamesh_dwh -f scripts/init-dwh.sql
      - name: Seed test fixtures
        run: |
          psql postgresql://dwh:dwh@localhost:5434/datamesh_dwh -c "
            INSERT INTO raw.orders_cdc (id, payload, __op, __source_ts_ms, __kafka_partition, __kafka_offset)
            VALUES 
              (1, '{\"id\": 1, \"customer_id\": 1, \"total_amount\": \"100.00\", \"status\": \"completed\", \"created_at\": \"2026-08-12T10:00:00+00:00\"}'::jsonb, 'c', 1786000000000, 0, 1),
              (2, '{\"id\": 2, \"customer_id\": 2, \"total_amount\": \"200.50\", \"status\": \"pending\", \"created_at\": \"2026-08-12T10:01:00+00:00\"}'::jsonb, 'c', 1786000000000, 0, 2);
          "
      - name: Run dbt
        run: |
          cd dbt_datamesh
          dbt run --target ci
      - name: Run dbt tests
        run: |
          cd dbt_datamesh
          dbt test --target ci

  integration-test:
    runs-on: ubuntu-latest
    needs: [unit-tests, dbt-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Start infrastructure
        run: |
          make up
          sleep 30
      - name: Check Kafka Connect
        run: |
          curl -sf http://localhost:8083/connectors || exit 1
      - name: Check connectors
        run: |
          curl -sf http://localhost:8083/connectors/orders-cdc-connector/status | grep RUNNING
          curl -sf http://localhost:8083/connectors/customers-cdc-connector/status | grep RUNNING
      - name: Check CDC consumer
        run: |
          sleep 10
          pgrep -f "cdc_consumer.py" || (echo "Consumer not running" && exit 1)
      - name: Generate test data
        run: |
          python scripts/data_generator.py --mode batch --count 5
          sleep 10
      - name: Verify DWH
        run: |
          docker exec postgres-dwh psql -U dwh -d datamesh_dwh -c             "SELECT COUNT(*) FROM raw.orders_cdc;" | grep -E '[0-9]+'
          docker exec postgres-dwh psql -U dwh -d datamesh_dwh -c             "SELECT COUNT(*) FROM raw.customers_cdc;" | grep -E '[0-9]+'
      - name: Run dbt on live data
        run: |
          cd dbt_datamesh
          dbt run && dbt test
      - name: Cleanup
        if: always()
        run: make down
