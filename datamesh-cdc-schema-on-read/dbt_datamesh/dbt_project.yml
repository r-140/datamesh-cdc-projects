name: 'datamesh_cdc'
version: '1.0.0'
config-version: 2

profile: 'datamesh_trino'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  datamesh_cdc:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

vars:
  iceberg_catalog: 'iceberg'
  raw_schema: 'raw'
