global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # REST API health (keep your existing)
  - job_name: "kafka-connect"
    static_configs:
      - targets: ["kafka-connect:8083"]
    metrics_path: /

  # NEW: JMX metrics from Kafka Connect (Debezium + task states)
  - job_name: "kafka-connect-jmx"
    static_configs:
      - targets: ["kafka-connect:7071"]
    metrics_path: /metrics
